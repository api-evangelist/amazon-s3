      - acl
      parameters:
      - name: acl
        in: query
        required: true
        description: Selects this operation. S3 identifies it by the `acl` subresource.
        schema:
          type: string
      - name: Bucket
        in: path
        required: true
        description: 'The bucket name that contains the object for which to get the ACL information. Access
          points - When you use this action with an access point for general purpose buckets, you must
          provide the alias of '
        schema:
          type: string
      - name: Key
        in: path
        required: true
        description: The key of the object for which to get the ACL information.
        schema:
          type: string
      - name: versionId
        in: query
        required: false
        description: Version ID used to reference a specific version of the object. This functionality
          is not supported for directory buckets.
        schema:
          type: string
      - name: x-amz-request-payer
        in: header
        required: false
        schema:
          type: string
          enum: &id001
          - requester
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
      responses:
