      summary: 'End of support notice: As of October 1, 2025, Amazon S3 has discontinued support for Email
        Grantee Access Control Lists '
      description: 'End of support notice: As of October 1, 2025, Amazon S3 has discontinued support for
        Email Grantee Access Control Lists (ACLs). If you attempt to use an Email Grantee ACL in a request
        after October 1, 2025, the request will receive an HTTP 405 (Method Not Allowed) error. This change
        affects the following Amazon Web Services Regions: US East (N. Virginia), US West (N. California),
        US West (Oregon), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe
        (Ireland), and South America (São Paulo). This operation is not supported for directory buckets.
        Uses the acl subresource to set the access control list (ACL) permissions for a new or existing
        object in an S3 bucket. You must have the WRITE_ACP permission to set the ACL of an object. For
        more information, see What permissions can I grant? in the Amazon S3 User Guide. This functionality
        is not supported for Amazon S3 on Outposts. Depending on your application needs, you can choose
        to set the ACL on an object using either the request body or the headers. For example, if you
        have an existing application that updates a bucket ACL using the request body, you can continue
        to use that approach. For more information, se'
      tags:
