      description: 'This operation is not supported for directory buckets. When you enable versioning
        on a bucket for the first time, it might take a short amount of time for the change to be fully
        propagated. While this change is propagating, you might encounter intermittent HTTP 404 NoSuchKey
        errors for requests to objects created or updated after enabling versioning. We recommend that
        you wait for 15 minutes after enabling versioning before issuing write operations (PUT or DELETE)
        on objects in the bucket. Sets the versioning state of an existing bucket. You can set the versioning
        state with one of the following values: Enabled—Enables versioning for the objects in the bucket.
        All objects added to the bucket receive a unique version ID. Suspended—Disables versioning for
        the objects in the bucket. All objects added to the bucket receive the version ID null. If the
        versioning state has never been set on a bucket, it has no versioning state; a GetBucketVersioning
        request does not return a versioning state value. In order to enable MFA Delete, you must be the
        bucket owner. If you are the bucket owner and want to enable MFA Delete in the bucket versioning
        configuration, you must include the x-amz-mfa re'
