      description: This operation aborts a multipart upload. After a multipart upload is aborted, no additional
        parts can be uploaded using that upload ID. The storage consumed by any previously uploaded parts
        will be freed. However, if any part uploads are currently in progress, those part uploads might
        or might not succeed. As a result, it might be necessary to abort a given multipart upload multiple
        times in order to completely free all storage consumed by all parts. To verify that all parts
        have been removed and prevent getting charged for the part storage, you should call the ListParts
        API operation and ensure that the parts list is empty. Directory buckets - If multipart uploads
        in a directory bucket are in progress, you can't delete the bucket until all the in-progress multipart
        uploads are aborted or completed. To delete these in-progress multipart uploads, use the ListMultipartUploads
        operation to list the in-progress multipart uploads in the bucket and use the AbortMultipartUpload
        operation to abort all the in-progress multipart uploads. Directory buckets - For directory buckets,
        you must make requests for this API operation to the Zonal endpoint. These endpoints support virtual-hosted-styl
