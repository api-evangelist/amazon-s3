        about Zonal endpoint API operations that include the Availability Zone in the request endpoint,
        see S3 Express One Zone APIs in the Amazon S3 User Guide. To make Zonal endpoint API requests
        on a directory bucket, use the CreateSession API operation. Specifically, you grant s3express:CreateSession
        permission to a bucket in a bucket policy or an IAM identity-based policy. Then, you use IAM credentials
        to make the CreateSession API request on the bucket, which returns temporary security credentials
        that include the access key ID, secret access key, session token, and expiration. These credentials
        have associated permissions to access the Zonal endpoint API operations. After the session is
        created, you don’t need to use other policies to grant permissions to each Zonal endpoint API
