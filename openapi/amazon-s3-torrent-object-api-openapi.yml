        object. This functionality is not supported for Amazon S3 on Outposts. The following action is
        related to GetObjectTorrent: GetObject You must URL encode any signed header values that contain
        spaces. For example, if your header value is my file.txt, containing two spaces after my, you
        must URL encode this value to my%20%20file.txt.'
      tags:
      - torrent
      parameters:
      - name: torrent
        in: query
        required: true
        description: Selects this operation. S3 identifies it by the `torrent` subresource.
        schema:
          type: string
      - name: Bucket
        in: path
        required: true
        description: The name of the bucket containing the object for which to get the torrent files.
        schema:
          type: string
      - name: Key
        in: path
        required: true
        description: The object key for which to get the information.
        schema:
          type: string
      - name: x-amz-request-payer
        in: header
        required: false
        schema:
          type: string
          enum:
          - requester
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
