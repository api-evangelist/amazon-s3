        BitTorrent can save you band
      description: 'This operation is not supported for directory buckets. Returns torrent files from
        a bucket. BitTorrent can save you bandwidth when you''re distributing large files. You can get
        torrent only for objects that are less than 5 GB in size, and that are not encrypted using server-side
