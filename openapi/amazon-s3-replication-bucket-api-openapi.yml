        information about permissions, see Permissions Related to Bucket Subresource Operations and Managing
        Access Permissions to Your Amazon S3 Resources. It can take a while for the deletion of a replication
        configuration to fully propagate. For information about replication configuration, see Replication
        in the Amazon S3 User Guide. The following operations are related to DeleteBucketReplication:
        PutBucketReplication GetBucketReplication You must URL encode any signed header values that contain
        spaces. For example, if your header value is my file.txt, containing two spaces after my, you
        must URL encode this value to my%20%20file.txt.'
