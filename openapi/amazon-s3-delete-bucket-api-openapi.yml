      summary: 'This operation enables you to delete multiple objects from a bucket using a single HTTP
        request. If you know the object '
      description: This operation enables you to delete multiple objects from a bucket using a single
        HTTP request. If you know the object keys that you want to delete, then this operation provides
        a suitable alternative to sending individual delete requests, reducing per-request overhead. The
        request can contain a list of up to 1,000 keys that you want to delete. In the XML, you provide
        the object key names, and optionally, version IDs if you want to delete a specific version of
        the object from a versioning-enabled bucket. For each key, Amazon S3 performs a delete operation
        and returns the result of that delete, success or failure, in the response. If the object specified
        in the request isn't found, Amazon S3 confirms the deletion by returning the result as deleted.
        Directory buckets - S3 Versioning isn't enabled and supported for directory buckets. Directory
        buckets - For directory buckets, you must make requests for this API operation to the Zonal endpoint.
        These endpoints support virtual-hosted-style requests in the format https://amzn-s3-demo-bucket.s3express-zone-id.region-code.amazonaws.com/key-name
        . Path-style requests are not supported. For more information about endpoints in Availability
        Z
