      description: 'Updates the annotation table configuration for an Amazon S3 bucket''s metadata configuration.
        Use this operation to enable or disable the annotation table, or to update its associated IAM
        role. An annotation table is a queryable Iceberg table that contains records of all annotations
        attached to objects in the bucket. To use this operation, the bucket must have an existing Amazon
        S3 Metadata configuration. To use this operation, you must have the s3:UpdateBucketMetadataAnnotationTableConfiguration
        permission. If you are specifying or changing the IAM role, you must also have iam:PassRole permission
        for the role. The IAM role must have a trust policy that allows the Amazon S3 metadata service
        to assume it, and a permissions policy that grants the actions needed to read annotations from
        your bucket. The following examples show a trust policy and a permissions policy that you can
        adapt for your bucket and account. The following operations are related to UpdateBucketMetadataAnnotationTableConfiguration:
        CreateBucketMetadataConfiguration GetBucketMetadataConfiguration'
