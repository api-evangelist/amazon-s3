info:
  title: Amazon S3 Acl (bucket-level)
  description: '2 operations from the Amazon S3 REST API, generated from the authoritative service model.


    S3 identifies these operations by the `acl` query subresource, which is declared as a required query
    parameter on each one because an OpenAPI path cannot carry a query string.


    Generated from boto/botocore `service-2.json` at `aeb03fc4ae530e0b3f47d588b6021581db870c8c` (Apache-2.0).
    Responses are XML.'
  version: '2006-03-01'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
externalDocs:
  description: Amazon S3 API Reference
  url: https://docs.aws.amazon.com/AmazonS3/latest/API/
