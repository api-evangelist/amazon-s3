        The bucket owner can grant this permission to others. For more information about permissions,
        see Permissions Related to Bucket Subresource Operations and Managing Access Permissions to Your
        Amazon S3 Resources. The Transfer Acceleration state of a bucket can be set to one of the following
        two values: Enabled – Enables accelerated data transfers to the bucket. Suspended – Disables accelerated
        data transfers to the bucket. The GetBucketAccelerateConfiguration action returns the transfer
        acceleration state of a bucket. After setting the Transfer Acceleration state of a bucket to Enabled,
        it might take up to thirty minutes before the data transfer rates to the bucket increase. The
        name of the bucket used for Transfer Acceleration must be DNS-compliant and must not contain periods
        ("."). For more information '
