        which is either Enabled or Suspended. Amazon S3 Transfer Acceleration is a bucket-level feature
        that enables you to perform faster data transfers to and from Amazon S3. To use this operation,
        you must have permission to perform the s3:GetAccelerateConfiguration action. The bucket owner
        has this permission by default. The bucket owner can grant this permission to others. For more
