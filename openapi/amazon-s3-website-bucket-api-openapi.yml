      operationId: PutBucketWebsite
      summary: This operation is not supported for directory buckets. Sets the configuration of the website
        that is specified in the we
      description: This operation is not supported for directory buckets. Sets the configuration of the
        website that is specified in the website subresource. To configure a bucket as a website, you
        can add this subresource on the bucket with website configuration information such as the file
        name of the index document and any redirect rules. For more information, see Hosting Websites
        on Amazon S3. This PUT action requires the S3:PutBucketWebsite permission. By default, only the
        bucket owner can configure the website attached to a bucket; however, bucket owners can allow
        other users to set the website configuration by writing a bucket policy that grants them the S3:PutBucketWebsite
        permission. To redirect all website requests sent to the bucket's website endpoint, you add a
        website configuration with the following elements. Because all requests are sent to another website,
        you don't need to provide index document name for the bucket. WebsiteConfiguration RedirectAllRequestsTo
        HostName Protocol If you want granular control over redirects, you can use the following elements
        to add routing rules that describe conditions for redirecting requests and information about the
        redirect destination. In this case
