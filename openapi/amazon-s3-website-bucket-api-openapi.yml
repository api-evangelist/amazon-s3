      operationId: GetBucketWebsite
      summary: This operation is not supported for directory buckets. Returns the website configuration
        for a bucket. To host website o
      description: 'This operation is not supported for directory buckets. Returns the website configuration
        for a bucket. To host website on Amazon S3, you can configure a bucket as website by adding a
        website configuration. For more information about hosting websites, see Hosting Websites on Amazon
        S3. This GET action requires the S3:GetBucketWebsite permission. By default, only the bucket owner
        can read the bucket website configuration. However, bucket owners can allow other users to read
        the website configuration by writing a bucket policy granting them the S3:GetBucketWebsite permission.
        The following operations are related to GetBucketWebsite: DeleteBucketWebsite PutBucketWebsite
        You must URL encode any signed header values that contain spaces. For example, if your header
        value is my file.txt, containing two spaces after my, you must URL encode this value to my%20%20file.txt.'
      tags:
      - website
      parameters:
      - name: website
        in: query
        required: true
        description: Selects this operation. S3 identifies it by the `website` subresource.
        schema:
          type: string
      - name: Bucket
        in: path
        required: true
        description: The bucket name for which to get the website configuration.
        schema:
          type: string
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
      responses:
        '200':
          description: Success. S3 answers in XML, not JSON.
          x-output-shape: GetBucketWebsiteOutput
        '403':
          description: AccessDenied. S3 validates the signature before it routes the operation, so this
            does not distinguish an unsupported operation from an unauthorised one.
