        metadata is supported so that the WriteGetObjectResponse caller, typically an Lambda function,
        can provide the same metadata when it internally invokes GetObject. When WriteGetObjectResponse
        is called by a customer-owned Lambda function, the metadata returned to the end user GetObject
        call might differ from what Amazon S3 would normally return. You can include any number of metadata
        headers. When including a metadata header, it should be prefaced with x-amz-meta. For example,
        x-amz-meta-my-custom-header: MyCustomValue. The primary use case for this is to forward GetObject
        metadata. Amazon Web Services provides some prebuilt Lambda functions that you can use with S3
        Object Lambda to detect and redact personally identifiable informa'
