openapi: 3.1.0
info:
  title: Amazon S3 Core (bucket-level)
  description: '5 operations from the Amazon S3 REST API, generated from the authoritative service model.


    Generated from boto/botocore `service-2.json` at `aeb03fc4ae530e0b3f47d588b6021581db870c8c` (Apache-2.0).
    Responses are XML.'
  version: '2006-03-01'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
externalDocs:
  description: Amazon S3 API Reference
  url: https://docs.aws.amazon.com/AmazonS3/latest/API/
servers:
- url: https://s3.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
tags:
- name: bucket
paths:
  /{Bucket}:
    put:
      operationId: CreateBucket
      summary: 'This action creates an Amazon S3 bucket. To create an Amazon S3 on Outposts bucket, see
        CreateBucket . Creates a new S3 '
      description: 'This action creates an Amazon S3 bucket. To create an Amazon S3 on Outposts bucket,
        see CreateBucket . Creates a new S3 bucket. To create a bucket, you must set up Amazon S3 and
        have a valid Amazon Web Services Access Key ID to authenticate requests. Anonymous requests are
        never allowed to create buckets. By creating the bucket, you become the bucket owner. There are
        two types of buckets: general purpose buckets and directory buckets. For more information about
        these bucket types, see Creating, configuring, and working with Amazon S3 buckets in the Amazon
        S3 User Guide. General purpose buckets exist in a global namespace, which means that each bucket
        name must be unique across all Amazon Web Services accounts in all the Amazon Web Services Regions
        within a partition. A partition is a grouping of Regions. Amazon Web Services currently has four
        partitions: aws (Standard Regions), aws-cn (China Regions), aws-us-gov (Amazon Web Services GovCloud
        (US)), and aws-eusc (European Sovereign Cloud). When you create a general purpose bucket, you
        can choose to create a bucket in the shared global namespace or you can choose to create a bucket
        in your account regional namespace. Your account reg'
      tags:
      - bucket
      parameters:
      - name: x-amz-acl
        in: header
        required: false
        description: The canned ACL to apply to the bucket. This functionality is not supported for directory
          buckets.
        schema:
          type: string
          enum:
          - private
          - public-read
          - public-read-write
          - authenticated-read
      - name: Bucket
        in: path
        required: true
        description: The name of the bucket to create. General purpose buckets - For information about
          bucket naming restrictions, see Bucket naming rules in the Amazon S3 User Guide. Directory buckets
          - When you use this
        schema:
          type: string
      - name: x-amz-grant-full-control
        in: header
        required: false
        description: Allows grantee the read, write, read ACP, and write ACP permissions on the bucket.
          This functionality is not supported for directory buckets.
        schema:
          type: string
      - name: x-amz-grant-read
        in: header
        required: false
        description: Allows grantee to list the objects in the bucket. This functionality is not supported
          for directory buckets.
        schema:
          type: string
      - name: x-amz-grant-read-acp
        in: header
        required: false
        description: Allows grantee to read the bucket ACL. This functionality is not supported for directory
          buckets.
        schema:
          type: string
      - name: x-amz-grant-write
        in: header
        required: false
        description: Allows grantee to create new objects in the bucket. For the bucket and object owners
          of existing objects, also allows deletions and overwrites of those objects. This functionality
          is not supported for
        schema:
          type: string
      - name: x-amz-grant-write-acp
        in: header
        required: false
        description: Allows grantee to write the ACL for the applicable bucket. This functionality is
          not supported for directory buckets.
        schema:
          type: string
      - name: x-amz-bucket-object-lock-enabled
        in: header
        required: false
        description: Specifies whether you want S3 Object Lock to be enabled for the new bucket. This
          functionality is not supported for directory buckets.
        schema:
          type: boolean
      - name: x-amz-object-ownership
        in: header
        required: false
        schema:
          type: string
          enum:
          - BucketOwnerPreferred
          - ObjectWriter
          - BucketOwnerEnforced
      - name: x-amz-bucket-namespace
        in: header
        required: false
        description: Specifies the namespace where you want to create your general purpose bucket. When
          you create a general purpose bucket, you can choose to create a bucket in the shared global
          namespace or you can choo
        schema:
          type: string
          enum:
          - account-regional
          - global
      responses:
        '200':
          description: Success. S3 answers in XML, not JSON.
          x-output-shape: CreateBucketOutput
        '403':
          description: AccessDenied. S3 validates the signature before it routes the operation, so this
            does not distinguish an unsupported operation from an unauthorised one.
    delete:
      operationId: DeleteBucket
      summary: Deletes the S3 bucket. All objects (including all object versions and delete markers) in
        the bucket must be deleted befo
      description: Deletes the S3 bucket. All objects (including all object versions and delete markers)
        in the bucket must be deleted before the bucket itself can be deleted. Directory buckets - If
        multipart uploads in a directory bucket are in progress, you can't delete the bucket until all
        the in-progress multipart uploads are aborted or completed. Directory buckets - For directory
        buckets, you must make requests for this API operation to the Regional endpoint. These endpoints
        support path-style requests in the format https://s3express-control.region-code.amazonaws.com/bucket-name
        . Virtual-hosted-style requests aren't supported. For more information about endpoints in Availability
        Zones, see Regional and Zonal endpoints for directory buckets in Availability Zones in the Amazon
        S3 User Guide. For more information about endpoints in Local Zones, see Concepts for directory
        buckets in Local Zones in the Amazon S3 User Guide. Permissions General purpose bucket permissions
        - You must have the s3:DeleteBucket permission on the specified bucket in a policy. Directory
        bucket permissions - You must have the s3express:DeleteBucket permission in an IAM identity-based
        policy instead of a bucket policy. Cross-
      tags:
      - bucket
      parameters:
      - name: Bucket
        in: path
        required: true
        description: Specifies the bucket being deleted. Directory buckets - When you use this operation
          with a directory bucket, you must use path-style requests in the format https://s3express-control.region-code.amazon
        schema:
          type: string
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
      responses:
        '200':
          description: Success. S3 answers in XML, not JSON.
        '403':
          description: AccessDenied. S3 validates the signature before it routes the operation, so this
            does not distinguish an unsupported operation from an unauthorised one.
    head:
      operationId: HeadBucket
      summary: You can use this operation to determine if a bucket exists and if you have permission to
        access it. The action returns a
      description: You can use this operation to determine if a bucket exists and if you have permission
        to access it. The action returns a 200 OK HTTP status code if the bucket exists and you have permission
        to access it. You can make a HeadBucket call on any bucket name to any Region in the partition,
        and regardless of the permissions on the bucket, you will receive a response header with the correct
        bucket location so that you can then make a proper, signed request to the appropriate Regional
        endpoint. If the bucket doesn't exist or you don't have permission to access it, the HEAD request
        returns a generic 400 Bad Request, 403 Forbidden, or 404 Not Found HTTP status code. A message
        body isn't included, so you can't determine the exception beyond these HTTP response codes. Authentication
        and authorization General purpose buckets - Request to public buckets that grant the s3:ListBucket
        permission publicly do not need to be signed. All other HeadBucket requests must be authenticated
        and signed by using IAM credentials (access key ID and secret access key for the IAM identities).
        All headers with the x-amz- prefix, including x-amz-copy-source, must be signed. For more information,
        see REST Authenticat
      tags:
      - bucket
      parameters:
      - name: Bucket
        in: path
        required: true
        description: The bucket name. Directory buckets - When you use this operation with a directory
          bucket, you must use virtual-hosted-style requests in the format Bucket-name.s3express-zone-id.region-code.amazonaws.c
        schema:
          type: string
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
      responses:
        '200':
          description: Success. S3 answers in XML, not JSON.
          x-output-shape: HeadBucketOutput
        '403':
          description: AccessDenied. S3 validates the signature before it routes the operation, so this
            does not distinguish an unsupported operation from an unauthorised one.
    get:
      operationId: ListObjects
      summary: This operation is not supported for directory buckets. Returns some or all (up to 1,000)
        of the objects in a bucket. You
      description: 'This operation is not supported for directory buckets. Returns some or all (up to
        1,000) of the objects in a bucket. You can use the request parameters as selection criteria to
        return a subset of the objects in a bucket. A 200 OK response can contain valid or invalid XML.
        Be sure to design your application to parse the contents of the response and handle it appropriately.
        This action has been revised. We recommend that you use the newer version, ListObjectsV2, when
        developing applications. For backward compatibility, Amazon S3 continues to support ListObjects.
        The following operations are related to ListObjects: ListObjectsV2 GetObject PutObject CreateBucket
        ListBuckets You must URL encode any signed header values that contain spaces. For example, if
        your header value is my file.txt, containing two spaces after my, you must URL encode this value
        to my%20%20file.txt.'
      tags:
      - bucket
      parameters:
      - name: Bucket
        in: path
        required: true
        description: The name of the bucket containing the objects. Directory buckets - When you use this
          operation with a directory bucket, you must use virtual-hosted-style requests in the format
          Bucket-name.s3express-z
        schema:
          type: string
      - name: delimiter
        in: query
        required: false
        description: A delimiter is a character that you use to group keys. CommonPrefixes is filtered
          out from results if it is not lexicographically greater than the key-marker.
        schema:
          type: string
      - name: encoding-type
        in: query
        required: false
        schema:
          type: string
          enum:
          - url
      - name: marker
        in: query
        required: false
        description: Marker is where you want Amazon S3 to start listing from. Amazon S3 starts listing
          after this specified key. Marker can be any key in the bucket.
        schema:
          type: string
      - name: max-keys
        in: query
        required: false
        description: Sets the maximum number of keys returned in the response. By default, the action
          returns up to 1,000 key names. The response might contain fewer keys but will never contain
          more.
        schema:
          type: integer
      - name: prefix
        in: query
        required: false
        description: Limits the response to keys that begin with the specified prefix.
        schema:
          type: string
      - name: x-amz-request-payer
        in: header
        required: false
        description: Confirms that the requester knows that she or he will be charged for the list objects
          request. Bucket owners need not specify this parameter in their requests.
        schema:
          type: string
          enum:
          - requester
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
      - name: x-amz-optional-object-attributes
        in: header
        required: false
        description: Specifies the optional fields that you want returned in the response. Fields that
          you do not specify are not returned.
        schema:
          type: string
      responses:
        '200':
          description: Success. S3 answers in XML, not JSON.
          x-output-shape: ListObjectsOutput
        '403':
          description: AccessDenied. S3 validates the signature before it routes the operation, so this
            does not distinguish an unsupported operation from an unauthorised one.
  /WriteGetObjectResponse:
