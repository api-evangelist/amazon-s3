      description: Retrieves all of the metadata from an object without returning the object itself. This
        operation is useful if you're interested only in an object's metadata. GetObjectAttributes combines
        the functionality of HeadObject and ListParts. All of the data returned with both of those individual
        calls can be returned with a single call to GetObjectAttributes. Directory buckets - For directory
        buckets, you must make requests for this API operation to the Zonal endpoint. These endpoints
        support virtual-hosted-style requests in the format https://amzn-s3-demo-bucket.s3express-zone-id.region-code.amazonaws.com/key-name
        . Path-style requests are not supported. For more information about endpoints in Availability
        Zones, see Regional and Zonal endpoints for directory buckets in Availability Zones in the Amazon
        S3 User Guide. For more information about endpoints in Local Zones, see Concepts for directory
        buckets in Local Zones in the Amazon S3 User Guide. Permissions General purpose bucket permissions
        - To use GetObjectAttributes, you must have READ access to the object. The other permissions that
        you need to use this operation depend on whether the bucket is versioned and if a version ID is
