      description: This operation is not supported for directory buckets or Amazon S3 on Outposts buckets.
        Updates the server-side encryption type of an existing encrypted object in a general purpose bucket.
        You can use the UpdateObjectEncryption operation to change encrypted objects from server-side
        encryption with Amazon S3 managed keys (SSE-S3) to server-side encryption with Key Management
        Service (KMS) keys (SSE-KMS), or to apply S3 Bucket Keys. You can also use the UpdateObjectEncryption
        operation to change the customer-managed KMS key used to encrypt your data so that you can comply
        with custom key-rotation standards. Using the UpdateObjectEncryption operation, you can atomically
        update the server-side encryption type of an existing object in a general purpose bucket without
        any data movement. The UpdateObjectEncryption operation uses envelope encryption to re-encrypt
        the data key used to encrypt and decrypt your object with your newly specified server-side encryption
