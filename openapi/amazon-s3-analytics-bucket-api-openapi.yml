      description: 'This operation is not supported for directory buckets. Deletes an analytics configuration
        for the bucket (specified by the analytics configuration ID). To use this operation, you must
        have permissions to perform the s3:PutAnalyticsConfiguration action. The bucket owner has this
        permission by default. The bucket owner can grant this permission to others. For more information
        about permissions, see Permissions Related to Bucket Subresource Operations and Managing Access
        Permissions to Your Amazon S3 Resources. For information about the Amazon S3 analytics feature,
        see Amazon S3 Analytics – Storage Class Analysis. The following operations are related to DeleteBucketAnalyticsConfiguration:
        GetBucketAnalyticsConfiguration ListBucketAnalyticsConfigurations PutBucketAnalyticsConfiguration
        You must URL encode any signed header values that contain spaces. For example, if your header
        value is my file.txt, containing two spaces after my, you must URL encode this value to my%20%20file.txt.'
      tags:
      - analytics
      parameters:
      - name: analytics
        in: query
        required: true
        description: Selects this operation. S3 identifies it by the `analytics` subresource.
        schema:
          type: string
      - name: Bucket
        in: path
        required: true
        description: The name of the bucket from which an analytics configuration is deleted.
        schema:
          type: string
      - name: id
        in: query
        required: true
        description: The ID that identifies the analytics configuration.
        schema:
          type: string
      - name: x-amz-expected-bucket-owner
        in: header
        required: false
        description: The account ID of the expected bucket owner. If the account ID that you provide does
          not match the actual owner of the bucket, the request fails with the HTTP status code 403 Forbidden
          (access denied)
        schema:
          type: string
      responses:
