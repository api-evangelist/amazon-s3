      summary: 'This operation is not supported for directory buckets. Sets an analytics configuration
        for the bucket (specified by the '
      description: This operation is not supported for directory buckets. Sets an analytics configuration
        for the bucket (specified by the analytics configuration ID). You can have up to 1,000 analytics
        configurations per bucket. You can choose to have storage class analysis export analysis reports
        sent to a comma-separated values (CSV) flat file. See the DataExport request element. Reports
        are updated daily and are based on the object filters that you configure. When selecting data
        export, you specify a destination bucket and an optional destination prefix where the file is
        written. You can export the data to a destination bucket in a different account. However, the
        destination bucket must be in the same Region as the bucket that you are making the PUT analytics
        configuration to. For more information, see Amazon S3 Analytics – Storage Class Analysis. You
        must create a bucket policy on the destination bucket where the exported file is written to grant
        permissions to Amazon S3 to write objects to the bucket. For an example policy, see Granting Permissions
        for Amazon S3 Inventory and Storage Class Analysis. To use this operation, you must have permissions
        to perform the s3:PutAnalyticsConfiguration act
      tags:
