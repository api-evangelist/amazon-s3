  mechanism: >-
    The S3 REST API version is fixed at 2006-03-01 and encoded in the SDKs/signing,
    not negotiated per request. New capabilities are added additively (new
    headers, query subresources, and operations) without breaking the dated
    contract. S3 Control uses the 2018-08-20 version; S3 Tables is a newer
    additive surface.
