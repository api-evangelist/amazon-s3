  changelog: https://docs.aws.amazon.com/AmazonS3/latest/API/WhatsNew.html
  sunset_header: false
  notes: >-
    S3 favors long-lived backward compatibility over removals. Notable retirements
    are handled at the feature level and pre-announced with long timelines (e.g.
    path-style request endpoints deprecated in favor of virtual-hosted-style;
    BitTorrent support removed; ListObjects (v1) superseded by ListObjectsV2 but
    still served). Deprecations are communicated via the What's New feed and AWS
    blog, not via Deprecation/Sunset response headers.
